<meta name="theme-color" content="#14110d">
<meta name="description" content="WoW Forever Legacy perks calculator and guide to earning Legacy Points">
<title>WoW Forever — Legacy Calculator</title>
<style>
:root{--g:26px;--bg:#14110d;--panel:#1f1a14;--line:#4a3b24;--gold:#ffd100;--txt:#e8dcc4;--dim:#9c8f78;--ok:#5fd35f;--bad:#ff5a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Arial,sans-serif;padding:16px}
.top{max-width:980px;margin:0 auto 14px;display:flex;flex-wrap:nowrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{flex:1;min-width:0}
h1{font-size:20px;margin:0;color:var(--gold)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex-shrink:0}
button{white-space:nowrap;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}button.on{background:#3b2f14;border-color:var(--gold);color:var(--gold)}
.pts{white-space:nowrap;min-width:190px;text-align:center;font-size:16px;padding:4px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.pts b{color:var(--gold)}
.trees{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.tree h2{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;color:var(--gold)}
.tree h2 span{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:22px repeat(4,56px);column-gap:10px;row-gap:var(--g);padding-top:6px}
.cell{position:relative;width:56px;height:56px}
.cell.dep::before{content:"";position:absolute;left:50%;margin-left:-1px;z-index:0;
  height:calc(var(--span)*(56px + var(--g)) - 56px);top:calc(-1*(var(--span)*(56px + var(--g)) - 56px));
  border-left:2px dashed #a08850}
.cell.dep.ok::before{border-color:var(--ok)}
.tl{color:var(--dim);font-size:12px;text-align:center;align-self:center}
.node{position:relative;z-index:1;width:56px;height:56px;border:2px solid #555;border-radius:6px;background:#0c0a07;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;filter:grayscale(1) brightness(.6)}
.node.av{border-color:var(--gold);filter:none}
.node.mx{border-color:var(--ok);filter:none}
.node .em{font-size:28px;position:absolute}
.node img{width:100%;height:100%;border-radius:4px;position:relative;pointer-events:none}
.node i{position:absolute;right:-5px;bottom:-7px;background:#000;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-style:normal;font-size:12px;color:var(--txt);z-index:2}
.node.mx i{color:var(--ok)}
#tip{position:fixed;z-index:9;max-width:290px;background:#0c0a07f2;border:1px solid var(--gold);border-radius:6px;padding:10px;pointer-events:none;display:none}
#tip h3{margin:0 0 4px;color:var(--gold);font-size:15px}
#tip .r{color:var(--dim);margin-bottom:6px}
#tip .bad{color:var(--bad)}#tip .good{color:var(--ok)}
#tip em{font-style:normal;color:var(--dim)}#tip em.cur{color:var(--ok);font-weight:bold}
#tip .h{margin-top:8px;color:var(--dim);font-size:12px}
.note{max-width:980px;margin:14px auto 0;color:var(--dim);font-size:12px}
.tabs{max-width:980px;margin:0 auto 12px;display:flex;gap:6px}
.tabs button{padding:8px 18px;font-size:15px}
.cards{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card,.zbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.card h3{margin:0 0 6px;color:var(--gold);font-size:16px;display:flex;justify-content:space-between}
.card h3 b{color:var(--ok)}
.card p{margin:0 0 6px;color:var(--dim);font-size:13px}
.card ul{margin:0;padding-left:18px}.card li{margin:3px 0}
.sec{max-width:980px;margin:22px auto 8px;color:var(--gold);font-size:18px}
.lead{max-width:980px;margin:0 auto 10px;color:var(--txt)}
.zones{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zbox h3{margin:0 0 8px;color:var(--gold);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:#0c0a07;font-size:13px}
.chip b{color:var(--dim);font-weight:normal;margin-left:4px}
.chip.new{border-color:var(--ok);color:var(--ok)}
@media(max-width:760px){.cards,.zones{grid-template-columns:1fr}.trees{grid-template-columns:1fr}.top,.ctl{flex-wrap:wrap}.pts{min-width:0}}
</style>
</head>

const SU={en:{head:"Where Legacy Points come from",lead:"There are 65 one-time challenges worth 1 point each, shared by all non-Hardcore characters on your account. The first point opens the Legacy panel (Y). Each character can spend up to 16 points at launch, and one character alone can earn 29, so alts are not required.",
 unlock:"The first point comes from any of: level 25 on any character, skill 150 in a crafting profession, or exploring the whole world map.",
 exp:"Exploration: which locations are required",
 expLead:"The Explorer challenge needs the achievement Explore Azeroth: uncover every map area of all 43 zones of the Eastern Kingdoms and Kalimdor on one character. Number = map areas to uncover.",
 ek:"Eastern Kingdoms",ka:"Kalimdor",newz:"new zone",tot:"zones",ar:"map areas",
 noZ:"Zephras Isle is not part of it. Zone names marked as new are Forever-only zones.",
 rew:"Collection rewards",rewLead:"Unlocked by total points earned, spent or not (up to 65).",pts:"points"},
 ru:{head:"За что дают очки Legacy",lead:"Всего 65 разовых испытаний по 1 очку, общих для всех персонажей аккаунта вне режима Hardcore. Первое очко открывает окно Legacy (клавиша Y). На старте каждый персонаж может потратить до 16 очков, а один персонаж способен заработать 29, так что альты не нужны.",
 unlock:"Первое очко даёт любое из: 25 уровень на любом персонаже, навык 150 в производственной профессии или исследование всей карты мира.",
 exp:"Исследование: какие локации нужны",
 expLead:"Для испытания «Исследователь» нужно достижение «Исследуйте Азерот»: открыть все области карты во всех 43 зонах Восточных Королевств и Калимдора на одном персонаже. Число — количество областей карты.",
 ek:"Восточные Королевства",ka:"Калимдор",newz:"новая зона",tot:"зон",ar:"областей карты",
 noZ:"Остров Зефрас в список не входит. Зоны с пометкой «новая» есть только в Forever. Русские названия новых зон неофициальные.",
 rew:"Награды коллекции",rewLead:"Открываются по общему числу заработанных очков, потраченных или нет (до 65).",pts:"очков"}};

function renderSrc(){
  const L=lang==="en"?0:1,T=SU[lang],pick=a=>a[L];
  const chips=a=>a.map(z=>`<span class="chip${z[3]?" new":""}">${z[L]}<b>${z[2]}</b>${z[3]?` · ${T.newz}`:""}</span>`).join("");
  const sum=a=>a.reduce((s,z)=>s+z[2],0);
  const zw=n=>lang==="ru"?((n%10===1&&n%100!==11)?"зона":(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?"зоны":"зон"):T.tot;
  $("viewSrc").innerHTML=
   `<h2 class="sec" style="margin-top:0">${T.head}</h2><p class="lead">${T.lead}</p><p class="lead" style="color:var(--dim)">${T.unlock}</p>
    <div class="cards">${CATS.map(c=>`<div class="card"><h3>${pick(c.n)}<b>+${c.p}</b></h3><p>${pick(c.d)}</p><ul>${c.l.map(x=>`<li>${pick(x)}</li>`).join("")}</ul></div>`).join("")}</div>
    <h2 class="sec">${T.exp}</h2><p class="lead">${T.expLead}</p>
    <div class="zones"><div class="zbox"><h3>${T.ek} — ${ZEK.length} ${zw(ZEK.length)}, ${sum(ZEK)} ${T.ar}</h3><div class="chips">${chips(ZEK)}</div></div>
    <div class="zbox"><h3>${T.ka} — ${ZKA.length} ${zw(ZKA.length)}, ${sum(ZKA)} ${T.ar}</h3><div class="chips">${chips(ZKA)}</div></div></div>
    <p class="note" style="margin-top:8px">${T.noZ}</p>
    <h2 class="sec">${T.rew}</h2><p class="lead">${T.rewLead}</p>
    <div class="cards" style="grid-template-columns:repeat(4,1fr)">${REWARDS.map(r=>`<div class="card"><h3>${r[0]} ${T.pts}</h3><p style="margin:0;color:var(--txt)">${r[L+1]}</p></div>`).join("")}</div>
    <p class="note">${lang==="ru"?"Источники: Blizzard (Get to Know the WoW: Forever Legacy System), Classic WoW Forever, MmonsteR. Данные беты, возможны изменения до релиза.":"Sources: Blizzard (Get to Know the WoW: Forever Legacy System), Classic WoW Forever, MmonsteR. Beta data, may change before launch."}</p>`;
}

let lang="en", tab="calc", ranks={};
try{const s=JSON.parse(localStorage.getItem("wfLegacy")||"{}");if(s.l)lang=s.l;if(s.t)tab=s.t;if(s.r)ranks=s.r}catch(e){}
P.forEach(p=>{ranks[p.id]=Math.min(ranks[p.id]||0,p.max)});

const total=r=>P.reduce((s,p)=>s+r[p.id],0);
const before=(t,tier,r)=>P.filter(p=>p.t===t&&p.tier<tier).reduce((s,p)=>s+r[p.id],0);
const rowOf=p=>p.tier;
const okReq=(p,r)=>{const row=rowOf(p);
  if(row>0&&before(p.t,row,r)<row)return false;
  if(p.req&&r[p.req.id]<p.req.p)return false;return true};
const valid=r=>total(r)<=MAX_POINTS&&P.every(p=>r[p.id]===0||okReq(p,r));
const canAdd=p=>ranks[p.id]<p.max&&total(ranks)<MAX_POINTS&&okReq(p,ranks);
const canRemove=p=>{if(ranks[p.id]<1)return false;const r={...ranks,[p.id]:ranks[p.id]-1};return valid(r)};

function save(){try{localStorage.setItem("wfLegacy",JSON.stringify({l:lang,t:tab,r:ranks}))}catch(e){}}
const $=id=>document.getElementById(id);

// column inside the tree grid (1-4); dependents sit directly under their prerequisite
const COL={rested:1,thrill:2,talented:1,guide:2,alert:3,medicine:4,flier:2,
 overtime:1,harvest:2,barter:1,perf:2,study:1,chef:2,lure:3,
 gourmand:1,quick:2,reinforce:3,perm:1,honor:3,diplomat:4,reagent:2};
function build(){
  const el=$("trees");el.innerHTML="";
  for(const t of [1,0,2]){ // display order: Professions, Adventure, Resourcefulness
    const box=document.createElement("div");box.className="tree";box.dataset.t=t;
    box.innerHTML=`<h2><b></b><span></span></h2>`;
    const g=document.createElement("div");g.className="grid";
    [0,5,10].forEach((row,ri)=>{
      const l=document.createElement("div");l.className="tl";l.textContent=row;
      l.style.gridColumn=1;l.style.gridRow=ri+1;g.appendChild(l);
    });
    P.filter(p=>p.t===t).forEach(p=>{
      const ri=rowOf(p)/5,c=document.createElement("div");c.className="cell";c.dataset.id=p.id;
      c.style.gridColumn=COL[p.id]+1;c.style.gridRow=ri+1;
      if(p.req){c.classList.add("dep");c.style.setProperty("--span",ri-rowOf(BY[p.req.id])/5)}
      c.innerHTML=`<div class="node" data-id="${p.id}"><span class="em">${p.em}</span><img alt="" data-n="${p.ic}" src="${ICON(p.ic)}" onerror="iconFail(this)"><i></i></div>`;
      g.appendChild(c);
    });
    box.appendChild(g);el.appendChild(box);
  }
}

function render(){
  document.documentElement.lang=lang;const U=UI[lang];
  document.title=U.title;$("title").textContent=U.title;
  $("tabCalc").textContent=U.tabCalc;$("tabSrc").textContent=U.tabSrc;
  $("tabCalc").classList.toggle("on",tab==="calc");$("tabSrc").classList.toggle("on",tab==="src");
  $("viewCalc").hidden=tab!=="calc";$("viewSrc").hidden=tab!=="src";
  $("pts").style.visibility=$("bReset").style.visibility=tab==="calc"?"visible":"hidden";
  if(tab==="src")renderSrc();
  $("pts").innerHTML=`${U.pts}: <b>${total(ranks)}</b> / ${MAX_POINTS}`;
  $("bReset").textContent=U.reset;
  $("bEn").classList.toggle("on",lang==="en");$("bRu").classList.toggle("on",lang==="ru");
  $("note").textContent=U.note;
  document.querySelectorAll(".tree").forEach(box=>{const t=+box.dataset.t;
    box.querySelector("b").textContent=U.trees[t];
    box.querySelector("span").textContent=P.filter(p=>p.t===t).reduce((s,p)=>s+ranks[p.id],0)+(lang==="ru"?" оч.":" pts");
  });
  document.querySelectorAll(".cell.dep").forEach(c=>{const q=BY[c.dataset.id].req;c.classList.toggle("ok",ranks[q.id]>=q.p)});
  document.querySelectorAll(".node").forEach(n=>{
    const p=BY[n.dataset.id],r=ranks[p.id];
    n.classList.toggle("mx",r===p.max);
    n.classList.toggle("av",r<p.max&&(r>0||canAdd(p)));
    n.querySelector("i").textContent=r+"/"+p.max;
  });
  save();
}

function descHtml(p,r){
  const L=lang==="en"?0:1;
  const fill=(arr)=>arr.map((x,i)=>`<em class="${i===r-1?"cur":""}">${x}</em>`).join(" / ");
  let s=p.d[L];
  if(p.v)s=s.replace(/\{v\}/g,()=>fill(p.v));
  if(p.w)s=s.replace(/\{w\}/g,()=>fill(p.w));
  return s;
}
function tipHtml(p){
  const U=UI[lang],L=lang==="en"?0:1,r=ranks[p.id],row=rowOf(p);let h=`<h3>${p.n[L]}</h3><div class="r">${U.rank} ${r}/${p.max}</div>`;
  if(row>0){const ok=before(p.t,row,ranks)>=row;h+=`<div class="${ok?"good":"bad"}">${U.tier.replace("{n}",row).replace("{tree}",U.trees[p.t])}</div>`}
  if(p.req){const ok=ranks[p.req.id]>=p.req.p;h+=`<div class="${ok?"good":"bad"}">${U.dep.replace("{p}",p.req.p).replace("{name}",BY[p.req.id].n[L])}</div>`}
  h+=`<div style="margin-top:6px">${descHtml(p,r)}</div><div class="h">${U.hint}</div>`;
  return h;
}

const tip=$("tip");
function showTip(e){
  const n=e.target.closest(".node");if(!n){tip.style.display="none";return}
  tip.innerHTML=tipHtml(BY[n.dataset.id]);tip.style.display="block";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=innerHeight-h-8;
  tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,y)+"px";
}
function act(n,remove){
  const p=BY[n.dataset.id];
  if(remove){if(canRemove(p))ranks[p.id]--}else{if(canAdd(p))ranks[p.id]++}
  render();tip.innerHTML=tipHtml(p);
}

const trees=$("trees");
trees.addEventListener("mousemove",showTip);
trees.addEventListener("mouseleave",()=>tip.style.display="none");
trees.addEventListener("click",e=>{const n=e.target.closest(".node");if(n)act(n,e.shiftKey)});
trees.addEventListener("contextmenu",e=>{const n=e.target.closest(".node");if(n){e.preventDefault();act(n,true)}});
let lp=null,lpDone=false;
trees.addEventListener("touchstart",e=>{const n=e.target.closest(".node");if(!n)return;lpDone=false;
  lp=setTimeout(()=>{lpDone=true;act(n,true)},500)},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>trees.addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
trees.addEventListener("click",e=>{if(lpDone){e.stopImmediatePropagation();lpDone=false}},true);
$("tabCalc").onclick=()=>{tab="calc";render()};
$("tabSrc").onclick=()=>{tab="src";tip.style.display="none";render()};
$("bReset").onclick=()=>{if(total(ranks)===0||confirm(UI[lang].confirm)){P.forEach(p=>ranks[p.id]=0);render()}};
$("bEn").onclick=()=>{lang="en";render()};   // language only changes labels; `ranks` is untouched
$("bRu").onclick=()=>{lang="ru";render()};

if(!valid(ranks))P.forEach(p=>ranks[p.id]=0);
build();render();
</script>
</body>
</html>
