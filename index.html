<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever — Legacy Calculator</title>
<style>
:root{--g:26px;--bg:#14110d;--panel:#1f1a14;--line:#4a3b24;--gold:#ffd100;--txt:#e8dcc4;--dim:#9c8f78;--ok:#5fd35f;--bad:#ff5a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Arial,sans-serif;padding:16px}
.top{max-width:980px;margin:0 auto 14px;display:flex;flex-wrap:nowrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{flex:1;min-width:0}
h1{font-size:20px;margin:0;color:var(--gold)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex-shrink:0}
button{white-space:nowrap;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}button.on{background:#3b2f14;border-color:var(--gold);color:var(--gold)}
.pts{white-space:nowrap;min-width:190px;text-align:center;font-size:16px;padding:4px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.pts b{color:var(--gold)}
.trees{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.tree h2{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;color:var(--gold)}
.tree h2 span{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:22px repeat(4,56px);column-gap:10px;row-gap:var(--g);padding-top:6px}
.cell{position:relative;width:56px;height:56px}
.cell.dep::before{content:"";position:absolute;left:50%;margin-left:-1px;z-index:0;
  height:calc(var(--span)*(56px + var(--g)) - 56px);top:calc(-1*(var(--span)*(56px + var(--g)) - 56px));
  border-left:2px dashed #a08850}
.cell.dep.ok::before{border-color:var(--ok)}
.tl{color:var(--dim);font-size:12px;text-align:center;align-self:center}
.node{position:relative;z-index:1;width:56px;height:56px;border:2px solid #555;border-radius:6px;background:#0c0a07;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;filter:grayscale(1) brightness(.6)}
.node.av{border-color:var(--gold);filter:none}
.node.mx{border-color:var(--ok);filter:none}
.node .em{font-size:28px;position:absolute}
.node img{width:100%;height:100%;border-radius:4px;position:relative;pointer-events:none}
.node i{position:absolute;right:-5px;bottom:-7px;background:#000;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-style:normal;font-size:12px;color:var(--txt);z-index:2}
.node.mx i{color:var(--ok)}
#tip{position:fixed;z-index:9;max-width:290px;background:#0c0a07f2;border:1px solid var(--gold);border-radius:6px;padding:10px;pointer-events:none;display:none}
#tip h3{margin:0 0 4px;color:var(--gold);font-size:15px}
#tip .r{color:var(--dim);margin-bottom:6px}
#tip .bad{color:var(--bad)}#tip .good{color:var(--ok)}
#tip em{font-style:normal;color:var(--dim)}#tip em.cur{color:var(--ok);font-weight:bold}
#tip .h{margin-top:8px;color:var(--dim);font-size:12px}
.note{max-width:980px;margin:14px auto 0;color:var(--dim);font-size:12px}
@media(max-width:760px){.trees{grid-template-columns:1fr}.top,.ctl{flex-wrap:wrap}.pts{min-width:0}}
</style>
</head>
<body>
<div class="top">
  <h1 id="title"></h1>
  <div class="ctl">
    <span class="pts" id="pts"></span>
    <button id="bReset"></button>
    <button id="bEn">EN</button><button id="bRu">RU</button>
  </div>
</div>
<div class="trees" id="trees"></div>
<div class="note" id="note"></div>
<div id="tip"></div>

<script>
const MAX_POINTS = 16;
// Icon names verified against talentsforever.com (beta-client data). Primary: Wowhead CDN, fallback: talentsforever.com
const ICON = n => "https://wow.zamimg.com/images/wow/icons/large/" + n + ".jpg";
const ICON2 = n => "https://talentsforever.com/assets/icons/" + n + ".jpg?i=4";
function iconFail(img){ if(!img.dataset.f){img.dataset.f=1;img.src=ICON2(img.dataset.n)}else img.remove() }
const rng = (a,b,s)=>{const r=[];for(let x=a;x<=b;x+=s)r.push(x);return r};

// tree: 0 Adventure, 1 Professions, 2 Resourcefulness. tier = points needed in earlier rows of the same tree.
const P = [
 {id:"rested",t:0,tier:0,max:5,ic:"spell_nature_sleep",em:"😴",n:["Well Rested","Хороший отдых"],v:rng(4,20,4),
  d:["Rested XP builds up {v}% faster and its cap is {v}% higher.","Бодрость копится на {v}% быстрее, а её максимум выше на {v}%."]},
 {id:"thrill",t:0,tier:0,max:5,ic:"ability_hunter_huntervswild",em:"⚔️",n:["Thrill of Adventure","Азарт приключений"],v:[1,2,3,4,5],
  d:["Killing blow on a non-trivial enemy restores {v}% of max Health and Mana over 10 sec. Not in dungeons, raids, BGs.","Добивание значимого врага восстанавливает {v}% макс. здоровья и маны за 10 сек. Не работает в подземельях, рейдах, на БГ."]},
 {id:"alert",t:0,tier:5,max:2,ic:"spell_shadow_detectlesserinvisibility",em:"👁️",n:["High Alert","Настороженность"],v:[1,2],
  d:["Detect Stealth as if your level were {v} higher. Not in BGs.","Обнаружение незаметных врагов, как будто ваш уровень выше на {v}. Не работает на БГ."]},
 {id:"talented",t:0,tier:5,max:5,ic:"ability_marksmanship",em:"📖",n:["Talented","Одарённый"],v:[9,8,7,6,5],req:{id:"rested",p:5},
  d:["Talent points start at level {v} instead of 10 (cap stays 51).","Очки талантов начинают выдаваться с {v} уровня вместо 10 (максимум остаётся 51)."]},
 {id:"guide",t:0,tier:5,max:3,ic:"inv_fishingchair",em:"⛺",n:["Field Guide","Полевой справочник"],v:[8,16,25],
  d:["Campsite feature cooldown reduced by {v}%.","Перезарядка добавления элементов лагеря короче на {v}%."]},
 {id:"medicine",t:0,tier:5,max:2,ic:"inv_misc_bandage_05",em:"🩹",n:["Field Medicine","Полевая медицина"],v:[5,10],
  d:["Recently Bandaged shortened by {v} sec. Not in dungeons, raids, BGs.","Эффект «Недавно перевязан» короче на {v} сек. Не работает в подземельях, рейдах, на БГ."]},
 {id:"flier",t:0,tier:10,max:1,ic:"achievement_guild_ridelikethewind",em:"🦅",n:["Frequent Flier","Частый путешественник"],req:{id:"guide",p:3},
  d:["Flight paths cost 50% less, and your flight mount flies 20% faster.","Перелёты дешевле на 50%, ездовое животное для перелётов летит на 20% быстрее."]},

 {id:"overtime",t:1,tier:0,max:5,ic:"inv_misc_pocketwatch_03",em:"⚙️",n:["Working Overtime","Сверхурочная работа"],v:rng(4,20,4),
  d:["+{v}% chance of a skill-up with any tradeskill.","+{v}% к шансу повысить навык любой профессии."]},
 {id:"harvest",t:1,tier:0,max:5,ic:"inv_misc_bag_18",em:"🌿",n:["Bountiful Harvest","Щедрый урожай"],v:rng(20,100,20),
  d:["{v}% more Scarce materials from Mining, Herbalism, Skinning.","На {v}% больше редких материалов при добыче руды, трав и снятии шкур."]},
 {id:"barter",t:1,tier:5,max:2,ic:"inv_misc_coin_06",em:"🪙",n:["Bartering","Торг"],v:[5,10],
  d:["Vendor prices reduced by {v}%.","Цены у торговцев ниже на {v}%."]},
 {id:"perf",t:1,tier:5,max:3,ic:"racial_dwarf_findtreasure",em:"📦",n:["Performance Bonus","Премия за работу"],v:[5,10,15],req:{id:"harvest",p:5},
  d:["{v}% chance of double Merchant's Favor when turning in a crate.","{v}% шанс получить вдвое больше Торговой благосклонности при сдаче ящика."]},
 {id:"chef",t:1,tier:10,max:5,ic:"achievement_profession_chefhat",em:"🍳",n:["Master Chef","Шеф-повар"],v:rng(10,50,10),
  d:["{v}% chance of an extra Cooking result.","{v}% шанс получить дополнительный результат при готовке."]},
 {id:"study",t:1,tier:10,max:1,ic:"inv_misc_book_08",em:"📚",n:["Dedicated Study","Усердная учёба"],req:{id:"barter",p:2},
  d:["+1 skill to your lowest tradeskill (or Elemental Essences if all maxed). 23 hour cooldown.","+1 к самой низкой профессии (или стихийные сущности, если всё на максимуме). Перезарядка 23 часа."]},
 {id:"lure",t:1,tier:10,max:2,ic:"inv_misc_basket_04",em:"🎣",n:["Luremaster","Мастер приманок"],v:[25,50],
  d:["{v}% chance of an extra fish when fishing with a Lure.","{v}% шанс поймать лишнюю рыбу с активной приманкой."]},

 {id:"gourmand",t:2,tier:0,max:3,ic:"inv_misc_food_64",em:"🍖",n:["Gourmand","Гурман"],v:[33,66,100],
  d:["Food buffs last {v}% longer.","Эффекты от еды длятся на {v}% дольше."]},
 {id:"quick",t:2,tier:0,max:2,ic:"spell_shadow_deadofnight",em:"👻",n:["The Quick and the Dead","Быстрый и мёртвый"],v:[5,10],w:[1,2],
  d:["+{v}% movement speed while dead; free casts for {w} min after resurrection or until combat.","+{v}% к скорости передвижения в виде духа; бесплатные заклинания на {w} мин после воскрешения или до боя."]},
 {id:"reinforce",t:2,tier:0,max:5,ic:"inv_misc_armorkit_17",em:"🛡️",n:["Reinforce","Укрепление"],v:rng(8,40,8),
  d:["{v}% less durability loss on death.","На {v}% меньше потеря прочности при смерти."]},
 {id:"honor",t:2,tier:5,max:5,ic:"achievement_bg_winwsg",em:"🏅",n:["For Great Honor","Во имя великой чести"],v:rng(2,10,2),
  d:["+{v}% Honor gained.","+{v}% к получаемым очкам чести."]},
 {id:"perm",t:2,tier:5,max:2,ic:"spell_misc_emotionhappy",em:"✨",n:["Permanence","Постоянство"],v:[50,100],req:{id:"gourmand",p:3},
  d:["Long group buffs and Camp rest buffs last {v}% longer.","Долгие баффы на группу и бонусы отдыха в лагере длятся на {v}% дольше."]},
 {id:"diplomat",t:2,tier:5,max:5,ic:"inv_scroll_03",em:"📜",n:["Diplomat","Дипломат"],v:rng(2,10,2),
  d:["+{v}% reputation gains.","+{v}% к получаемой репутации."]},
 {id:"reagent",t:2,tier:10,max:1,ic:"inv_misc_candle_02",em:"🧪",n:["Reagent Economy","Экономия реагентов"],req:{id:"quick",p:2},
  d:["Class abilities no longer need vendor-bought reagents.","Классовые умения больше не требуют реагентов, покупаемых у торговцев."]}
];
const BY = Object.fromEntries(P.map(p=>[p.id,p]));

const UI = {
 en:{title:"WoW Forever — Legacy Perks Calculator",pts:"Points spent",reset:"Reset all",
  trees:["Adventure","Professions","Resourcefulness"],rank:"Rank",
  tier:"Requires {n} points in earlier rows of {tree}",dep:"Requires {p} points in {name}",
  hint:"Left click: add · Right click / Shift+click / long press: remove",
  note:"Legacy Points are earned account-wide (up to 65); each character can spend up to 16 at launch. Rows unlock by points spent in the earlier rows of the same tree. Language switching never changes your spent points. Icons load from the Wowhead CDN (backup: Talents Forever); if one is missing, an emoji is shown instead.",
  confirm:"Reset all spent points?"},
 ru:{title:"WoW Forever — калькулятор перков Legacy",pts:"Потрачено очков",reset:"Сбросить всё",
  trees:["Приключения","Профессии","Находчивость"],rank:"Ранг",
  tier:"Нужно {n} очков в предыдущих рядах: {tree}",dep:"Нужно {p} очк. в перке «{name}»",
  hint:"ЛКМ: добавить · ПКМ / Shift+клик / долгое нажатие: убрать",
  note:"Очки Legacy зарабатываются на весь аккаунт (до 65); на старте каждый персонаж может потратить до 16. Ряды открываются по очкам, вложенным в предыдущие ряды того же дерева. Смена языка не меняет вложенные очки. Иконки грузятся с CDN Wowhead (запасной источник: Talents Forever); если иконки нет, показывается эмодзи.",
  confirm:"Сбросить все вложенные очки?"}
};

let lang="en", ranks={};
try{const s=JSON.parse(localStorage.getItem("wfLegacy")||"{}");if(s.l)lang=s.l;if(s.r)ranks=s.r}catch(e){}
P.forEach(p=>{ranks[p.id]=Math.min(ranks[p.id]||0,p.max)});

const total=r=>P.reduce((s,p)=>s+r[p.id],0);
const before=(t,tier,r)=>P.filter(p=>p.t===t&&p.tier<tier).reduce((s,p)=>s+r[p.id],0);
const rowOf=p=>p.tier;
const okReq=(p,r)=>{const row=rowOf(p);
  if(row>0&&before(p.t,row,r)<row)return false;
  if(p.req&&r[p.req.id]<p.req.p)return false;return true};
const valid=r=>total(r)<=MAX_POINTS&&P.every(p=>r[p.id]===0||okReq(p,r));
const canAdd=p=>ranks[p.id]<p.max&&total(ranks)<MAX_POINTS&&okReq(p,ranks);
const canRemove=p=>{if(ranks[p.id]<1)return false;const r={...ranks,[p.id]:ranks[p.id]-1};return valid(r)};

function save(){try{localStorage.setItem("wfLegacy",JSON.stringify({l:lang,r:ranks}))}catch(e){}}
const $=id=>document.getElementById(id);

// column inside the tree grid (1-4); dependents sit directly under their prerequisite
const COL={rested:1,thrill:2,talented:1,guide:2,alert:3,medicine:4,flier:2,
 overtime:1,harvest:2,barter:1,perf:2,study:1,chef:2,lure:3,
 gourmand:1,quick:2,reinforce:3,perm:1,honor:3,diplomat:4,reagent:2};
function build(){
  const el=$("trees");el.innerHTML="";
  for(let t=0;t<3;t++){
    const box=document.createElement("div");box.className="tree";
    box.innerHTML=`<h2><b></b><span></span></h2>`;
    const g=document.createElement("div");g.className="grid";
    [0,5,10].forEach((row,ri)=>{
      const l=document.createElement("div");l.className="tl";l.textContent=row;
      l.style.gridColumn=1;l.style.gridRow=ri+1;g.appendChild(l);
    });
    P.filter(p=>p.t===t).forEach(p=>{
      const ri=rowOf(p)/5,c=document.createElement("div");c.className="cell";c.dataset.id=p.id;
      c.style.gridColumn=COL[p.id]+1;c.style.gridRow=ri+1;
      if(p.req){c.classList.add("dep");c.style.setProperty("--span",ri-rowOf(BY[p.req.id])/5)}
      c.innerHTML=`<div class="node" data-id="${p.id}"><span class="em">${p.em}</span><img alt="" data-n="${p.ic}" src="${ICON(p.ic)}" onerror="iconFail(this)"><i></i></div>`;
      g.appendChild(c);
    });
    box.appendChild(g);el.appendChild(box);
  }
}

function render(){
  document.documentElement.lang=lang;const U=UI[lang];
  document.title=U.title;$("title").textContent=U.title;
  $("pts").innerHTML=`${U.pts}: <b>${total(ranks)}</b> / ${MAX_POINTS}`;
  $("bReset").textContent=U.reset;
  $("bEn").classList.toggle("on",lang==="en");$("bRu").classList.toggle("on",lang==="ru");
  $("note").textContent=U.note;
  document.querySelectorAll(".tree").forEach((box,t)=>{
    box.querySelector("b").textContent=U.trees[t];
    box.querySelector("span").textContent=P.filter(p=>p.t===t).reduce((s,p)=>s+ranks[p.id],0)+(lang==="ru"?" оч.":" pts");
  });
  document.querySelectorAll(".cell.dep").forEach(c=>{const q=BY[c.dataset.id].req;c.classList.toggle("ok",ranks[q.id]>=q.p)});
  document.querySelectorAll(".node").forEach(n=>{
    const p=BY[n.dataset.id],r=ranks[p.id];
    n.classList.toggle("mx",r===p.max);
    n.classList.toggle("av",r<p.max&&(r>0||canAdd(p)));
    n.querySelector("i").textContent=r+"/"+p.max;
  });
  save();
}

function descHtml(p,r){
  const L=lang==="en"?0:1;
  const fill=(arr)=>arr.map((x,i)=>`<em class="${i===r-1?"cur":""}">${x}</em>`).join(" / ");
  let s=p.d[L];
  if(p.v)s=s.replace(/\{v\}/g,()=>fill(p.v));
  if(p.w)s=s.replace(/\{w\}/g,()=>fill(p.w));
  return s;
}
function tipHtml(p){
  const U=UI[lang],L=lang==="en"?0:1,r=ranks[p.id],row=rowOf(p);let h=`<h3>${p.n[L]}</h3><div class="r">${U.rank} ${r}/${p.max}</div>`;
  if(row>0){const ok=before(p.t,row,ranks)>=row;h+=`<div class="${ok?"good":"bad"}">${U.tier.replace("{n}",row).replace("{tree}",U.trees[p.t])}</div>`}
  if(p.req){const ok=ranks[p.req.id]>=p.req.p;h+=`<div class="${ok?"good":"bad"}">${U.dep.replace("{p}",p.req.p).replace("{name}",BY[p.req.id].n[L])}</div>`}
  h+=`<div style="margin-top:6px">${descHtml(p,r)}</div><div class="h">${U.hint}</div>`;
  return h;
}

const tip=$("tip");
function showTip(e){
  const n=e.target.closest(".node");if(!n){tip.style.display="none";return}
  tip.innerHTML=tipHtml(BY[n.dataset.id]);tip.style.display="block";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=innerHeight-h-8;
  tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,y)+"px";
}
function act(n,remove){
  const p=BY[n.dataset.id];
  if(remove){if(canRemove(p))ranks[p.id]--}else{if(canAdd(p))ranks[p.id]++}
  render();tip.innerHTML=tipHtml(p);
}

const trees=$("trees");
trees.addEventListener("mousemove",showTip);
trees.addEventListener("mouseleave",()=>tip.style.display="none");
trees.addEventListener("click",e=>{const n=e.target.closest(".node");if(n)act(n,e.shiftKey)});
trees.addEventListener("contextmenu",e=>{const n=e.target.closest(".node");if(n){e.preventDefault();act(n,true)}});
let lp=null,lpDone=false;
trees.addEventListener("touchstart",e=>{const n=e.target.closest(".node");if(!n)return;lpDone=false;
  lp=setTimeout(()=>{lpDone=true;act(n,true)},500)},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>trees.addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
trees.addEventListener("click",e=>{if(lpDone){e.stopImmediatePropagation();lpDone=false}},true);
$("bReset").onclick=()=>{if(total(ranks)===0||confirm(UI[lang].confirm)){P.forEach(p=>ranks[p.id]=0);render()}};
$("bEn").onclick=()=>{lang="en";render()};   // language only changes labels; `ranks` is untouched
$("bRu").onclick=()=>{lang="ru";render()};

if(!valid(ranks))P.forEach(p=>ranks[p.id]=0);
build();render();
</script>
</body>
</html>
